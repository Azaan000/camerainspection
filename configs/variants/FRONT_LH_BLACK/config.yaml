variant_id: "FRONT_LH_BLACK"
description: "Front Left Hand Seat - Black Leather/Rexene"
hand: "LH"
position: "FRONT"
color: "BLACK"

# Nominal target values for tolerance checks
nominals:
  stitch:
    stitches_per_inch: 6.0
    seam_position_mm: 12.0
    thread_color_bgr: [210, 210, 210]
  plastic:
    shield_gap_mm: 2.5
  mechanism:
    recliner_angle_deg: 90.0
    track_end_position_mm: 240.0

# Expected plastic components for station 3 presence/hand check
components:
  side_shield:
    expected_hand: "LH"
    required: true
  handle:
    expected_hand: "LH"
    required: true
  lever:
    expected_hand: "LH"
    required: true
  isofix_cover:
    count: 2
    required: true
  clips:
    count: 6
    required: true

# Golden images directory relative to this config
golden_images_dir: "golden_images"

# Variant-specific limit overrides (empty means default_limits.yaml applies)
limit_overrides: {}
