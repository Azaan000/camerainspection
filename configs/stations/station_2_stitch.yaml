station_id: "STATION_2"
name: "Stitching on Sewing Jig"
description: "Rule-based measurement for stitches and position; AI model for broken thread and loose ends."
enabled: true

# Multi-camera configuration
# Resolution targets: 0.08 to 0.10 mm/pixel for stitch cameras
cameras:
  - name: "left_bolster"
    view: "left_bolster"
    enabled: true
    adapter: "replay"
    replay_dir: "data/station_2/replay/left_bolster"
    resolution: [2592, 1944]
    exposure_us: 12000
    gain_db: 0.0
    pixel_size_mm: 0.08 # Target: 0.08 to 0.10 mm/pixel
    timeout_ms: 3000
    regions_of_interest:
      main_seam:
        x: 150
        y: 300
        w: 2300
        h: 400
    lighting:
      direct_intensity_pct: 90

  - name: "right_bolster"
    view: "right_bolster"
    enabled: true
    adapter: "replay"
    replay_dir: "data/station_2/replay/right_bolster"
    resolution: [2592, 1944]
    exposure_us: 12000
    gain_db: 0.0
    pixel_size_mm: 0.08 # Target: 0.08 to 0.10 mm/pixel
    timeout_ms: 3000
    regions_of_interest:
      main_seam:
        x: 150
        y: 300
        w: 2300
        h: 400
    lighting:
      direct_intensity_pct: 90

  - name: "headrest"
    view: "headrest"
    enabled: true
    adapter: "replay"
    replay_dir: "data/station_2/replay/headrest"
    resolution: [2592, 1944]
    exposure_us: 12000
    gain_db: 0.0
    pixel_size_mm: 0.09 # Target: 0.08 to 0.10 mm/pixel
    timeout_ms: 3000
    regions_of_interest:
      main_seam:
        x: 150
        y: 300
        w: 2300
        h: 400
    lighting:
      direct_intensity_pct: 85

  - name: "seam_arm"
    view: "seam_arm"
    enabled: true # Robot-arm camera enabled by default, individually switchable
    adapter: "replay"
    replay_dir: "data/station_2/replay/seam_arm"
    resolution: [2592, 1944]
    exposure_us: 10000
    gain_db: 0.0
    pixel_size_mm: 0.08 # Target: 0.08 to 0.10 mm/pixel
    timeout_ms: 3000
    poses:
      - name: "bolster_start"
        x: 100
        y: 200
        z: 350
        roll: 0
        pitch: 45
        yaw: 0
      - name: "bolster_end"
        x: 100
        y: 600
        z: 350
        roll: 0
        pitch: 45
        yaw: 0
    regions_of_interest:
      main_seam:
        x: 150
        y: 300
        w: 2300
        h: 400
    lighting:
      direct_intensity_pct: 90

# Backwards compatibility single camera block
camera:
  adapter: "replay"
  replay_dir: "data/station_2/replay"
  resolution: [2592, 1944]
  exposure_us: 12000
  gain_db: 0.0
  pixel_size_mm: 0.05
  timeout_ms: 3000

lighting:
  direct_intensity_pct: 90

regions_of_interest:
  main_seam:
    x: 150
    y: 300
    w: 2300
    h: 400

model:
  backend: "mock"
  model_type: "yolo_stitch_defect"
  weights_path: "models/station_2/yolo_defect.onnx"
  version: "v0.1.0"
  threshold: 0.50

trigger:
  timeout_s: 5.0
