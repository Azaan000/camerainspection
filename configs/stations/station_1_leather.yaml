station_id: "STATION_1"
name: "Leather / Rexene Panel Inspection"
description: "Dark surfaces under dome and low-angle lighting. Anomaly detection + segmentation."
enabled: true

# Multi-camera configuration
# Resolution targets: 0.15 to 0.20 mm/pixel for leather faces
cameras:
  - name: "front_cushion_backrest"
    view: "front_cushion_backrest"
    enabled: true
    adapter: "replay"
    replay_dir: "data/station_1/replay/front_cushion_backrest"
    resolution: [2592, 1944]
    exposure_us: 15000
    gain_db: 0.0
    pixel_size_mm: 0.18 # Target: 0.15 to 0.20 mm/pixel
    timeout_ms: 3000
    regions_of_interest:
      seating_face:
        x: 200
        y: 200
        w: 2200
        h: 1500
    lighting:
      dome_intensity_pct: 80
      low_angle_intensity_pct: 60

  - name: "rear_back_map_pocket"
    view: "rear_back_map_pocket"
    enabled: true
    adapter: "replay"
    replay_dir: "data/station_1/replay/rear_back_map_pocket"
    resolution: [2592, 1944]
    exposure_us: 15000
    gain_db: 0.0
    pixel_size_mm: 0.18 # Target: 0.15 to 0.20 mm/pixel
    timeout_ms: 3000
    regions_of_interest:
      side_back:
        x: 100
        y: 100
        w: 2400
        h: 1800
    lighting:
      dome_intensity_pct: 75
      low_angle_intensity_pct: 60

# Backwards compatibility single camera block
camera:
  adapter: "replay"
  replay_dir: "data/station_1/replay"
  resolution: [2592, 1944]
  exposure_us: 15000
  gain_db: 0.0
  pixel_size_mm: 0.08
  timeout_ms: 3000

lighting:
  dome_intensity_pct: 80
  low_angle_intensity_pct: 60

regions_of_interest:
  seating_face:
    x: 200
    y: 200
    w: 2200
    h: 1500
  side_back:
    x: 100
    y: 100
    w: 2400
    h: 1800

model:
  backend: "mock"
  model_type: "anomalib_patchcore"
  weights_path: "models/station_1/patchcore.onnx"
  version: "v0.1.0"
  threshold: 0.45

trigger:
  timeout_s: 5.0
