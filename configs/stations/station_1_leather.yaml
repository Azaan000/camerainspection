station_id: "STATION_1"
name: "Leather / Rexene Panel Inspection"
description: "Dark surfaces under dome and low-angle lighting. Anomaly detection + segmentation."
enabled: true

camera:
  adapter: "replay" # "replay", "webcam", "basler", "hikrobot"
  replay_dir: "data/station_1/replay"
  resolution: [2592, 1944]
  exposure_us: 15000
  gain_db: 0.0
  pixel_size_mm: 0.08
  timeout_ms: 3000

lighting:
  dome_intensity_pct: 80
  low_angle_intensity_pct: 60

regions_of_interest:
  seating_face:
    x: 200
    y: 200
    w: 2200
    h: 1500
  side_back:
    x: 100
    y: 100
    w: 2400
    h: 1800

model:
  backend: "mock" # "mock", "onnx", "tensorrt"
  model_type: "anomalib_patchcore"
  weights_path: "models/station_1/patchcore.onnx"
  version: "v0.1.0"
  threshold: 0.45

trigger:
  timeout_s: 5.0
