version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: camerainspection-db
    environment:
      POSTGRES_USER: inspection
      POSTGRES_PASSWORD: inspection_secret
      POSTGRES_DB: seat_inspection
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspection -d seat_inspection"]
      interval: 5s
      timeout: 5s
      retries: 5

  inspection-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: camerainspection-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://inspection:inspection_secret@db:5432/seat_inspection"
      PYTHONPATH: "/app/src"
    volumes:
      - ../data:/app/data
      - ../storage:/app/storage
      - ../configs:/app/configs
    command: ["pytest", "-v"]

volumes:
  postgres_data:
